services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - pharmia-db:/app/db
    environment:
      - DATABASE_URL=sqlite:///./db/pharmia.db
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-pharmia-dev-secret-key-mude-em-producao}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3004,http://127.0.0.1:3004
    restart: unless-stopped
    networks:
      - pharmia-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3004:3000"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pharmia-net


volumes:
  pharmia-db:

networks:
  pharmia-net:
    driver: bridge
